[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "didyouship"
version = "2.0.0"
description = "Production readiness scanner: email auth, SSL, leaked secrets (HTML + JS bundles), DNS, headers, SEO and performance from public data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["dnspython>=2.6"]
keywords = ["security", "spf", "dmarc", "dkim", "ssl", "seo", "secrets", "scanner", "production-readiness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "slowapi>=0.1.9", "jinja2>=3.1"]
dev = ["pytest>=7", "httpx>=0.25", "pyflakes>=3"]

[project.scripts]
didyouship = "didyouship.cli:main"

[project.urls]
Source = "https://github.com/rozetyp/did-you-ship"

[tool.setuptools]
packages = ["didyouship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
