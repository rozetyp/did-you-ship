name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[web,dev]"
      - run: pyflakes didyouship app.py pages.py tests
      - run: pytest -q
      - name: CLI smoke test (installed entry point)
        run: didyouship --help
